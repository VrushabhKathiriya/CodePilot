  services:
    db:
      image: postgres:16-alpine
      container_name: codepilot-db
      restart: unless-stopped
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: codepilotpass
        POSTGRES_DB: codepilot_db
      ports:
        - "5433:5432"
      volumes:
        - codepilot_pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d codepilot_db"]
        interval: 5s
        timeout: 5s
        retries: 5

    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: codepilot-backend
      restart: unless-stopped
      env_file:
        - ./backend/.env.docker
      ports:
        - "8001:8000"
      depends_on:
        db:
          condition: service_healthy

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          VITE_API_URL: http://localhost:8001/api/v1
      container_name: codepilot-frontend
      ports:
        - "5173:80"
      depends_on:
        - backend

  volumes:
    codepilot_pgdata: